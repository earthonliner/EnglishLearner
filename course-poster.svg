<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Hero -->
  <rect x="0" y="0" width="1080" height="360" fill="url(#hero)"/>
  <circle cx="960" cy="60" r="140" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="120" cy="330" r="90" fill="#FFFFFF" opacity="0.12"/>
  <text x="60" y="95" font-size="30" fill="#FFF3E0" font-weight="600">少儿英语启蒙 · 24 次课系统课程</text>
  <text x="60" y="185" font-size="76" fill="#FFFFFF" font-weight="800">Our World + Phonics</text>
  <text x="60" y="250" font-size="40" fill="#FFFFFF" font-weight="600">从“会说”到“会读”，一步步建立英语自信</text>
  <g font-size="24" font-weight="600" fill="#E8551E">
    <rect x="60" y="285" width="200" height="46" rx="23" fill="#FFFFFF"/>
    <text x="160" y="317" text-anchor="middle">24 次课 · 6 阶段</text>
    <rect x="280" y="285" width="230" height="46" rx="23" fill="#FFFFFF"/>
    <text x="395" y="317" text-anchor="middle">主题词汇 + 自然拼读</text>
    <rect x="530" y="285" width="200" height="46" rx="23" fill="#FFFFFF"/>
    <text x="630" y="317" text-anchor="middle">4 次阶段复习</text>
    <rect x="750" y="285" width="200" height="46" rx="23" fill="#FFFFFF"/>
    <text x="850" y="317" text-anchor="middle">结业展示 + 证书</text>
  </g>

  <!-- Two learning tracks -->
  <g filter="url(#shadow)">
    <rect x="60" y="400" width="465" height="150" rx="20" fill="#FFFFFF"/>
    <rect x="555" y="400" width="465" height="150" rx="20" fill="#FFFFFF"/>
  </g>
  <text x="90" y="448" font-size="30" font-weight="700" fill="#2B7DE9">🌍 Our World 主题线</text>
  <text x="90" y="490" font-size="22" fill="#555">学校 · 玩具 · 家庭 · 身体 · 故事</text>
  <text x="90" y="522" font-size="22" fill="#555">食物 · 服装 · 动物｜颜色 · 数字 · 日常句型</text>
  <text x="585" y="448" font-size="30" font-weight="700" fill="#E8551E">🔤 Phonics 拼读线</text>
  <text x="585" y="490" font-size="22" fill="#555">字母音 → 短元音 → 辅音组合 th / ch / sh</text>
  <text x="585" y="522" font-size="22" fill="#555">CVC 拼合 → 独立解码 → 读懂简单句子</text>

  <!-- Roadmap -->
  <text x="60" y="620" font-size="36" font-weight="800" fill="#333">课程路线图</text>
  <line x1="300" y1="612" x2="1020" y2="612" stroke="#F3D9B8" stroke-width="3"/>
  <line x1="110" y1="680" x2="110" y2="1560" stroke="#F0C9A0" stroke-width="6" stroke-linecap="round"/>

  <!-- Phase 1 -->
  <circle cx="110" cy="720" r="34" fill="#7AC943"/>
  <text x="110" y="732" font-size="30" text-anchor="middle">🌱</text>
  <g filter="url(#shadow)"><rect x="170" y="665" width="850" height="115" rx="18" fill="#FFFFFF"/></g>
  <rect x="170" y="665" width="12" height="115" rx="6" fill="#7AC943"/>
  <text x="205" y="705" font-size="28" font-weight="700" fill="#333">Phase 1 · Welcome to English</text>
  <text x="990" y="705" font-size="22" fill="#7AC943" font-weight="700" text-anchor="end">第 1–2 课</text>
  <text x="205" y="740" font-size="21" fill="#555">问候 · 课堂指令 · 颜色 red / blue · 数字 1–2</text>
  <text x="205" y="768" font-size="21" fill="#E8551E">Phonics：p / b / t / d · 第一次体验“听声音找字母”与拼合 (pig)</text>

  <!-- Phase 2 -->
  <circle cx="110" cy="865" r="34" fill="#2B7DE9"/>
  <text x="110" y="877" font-size="30" text-anchor="middle">🏫</text>
  <g filter="url(#shadow)"><rect x="170" y="810" width="850" height="115" rx="18" fill="#FFFFFF"/></g>
  <rect x="170" y="810" width="12" height="115" rx="6" fill="#2B7DE9"/>
  <text x="205" y="850" font-size="28" font-weight="700" fill="#333">Phase 2 · My School + My Toys</text>
  <text x="990" y="850" font-size="22" fill="#2B7DE9" font-weight="700" text-anchor="end">第 3–7 课</text>
  <text x="205" y="885" font-size="21" fill="#555">文具 · 玩具 · 颜色 green / yellow · 数字 3–6 · What's this? / Is it a...?</text>
  <text x="205" y="913" font-size="21" fill="#E8551E">Phonics：s z m n · f v g l · CVC 拼读 (sun / map) · 第 7 课 综合复习 + 小测</text>

  <!-- Phase 3 -->
  <circle cx="110" cy="1010" r="34" fill="#F5A623"/>
  <text x="110" y="1022" font-size="30" text-anchor="middle">👪</text>
  <g filter="url(#shadow)"><rect x="170" y="955" width="850" height="115" rx="18" fill="#FFFFFF"/></g>
  <rect x="170" y="955" width="12" height="115" rx="6" fill="#F5A623"/>
  <text x="205" y="995" font-size="28" font-weight="700" fill="#333">Phase 3 · My Family + My Body</text>
  <text x="990" y="995" font-size="22" fill="#F5A623" font-weight="700" text-anchor="end">第 8–12 课</text>
  <text x="205" y="1030" font-size="21" fill="#555">家庭成员 · 身体部位 · 数字 7–10 · Who's this? / I've got...</text>
  <text x="205" y="1058" font-size="21" fill="#E8551E">Phonics：短元音 a e i o u · y · 建立 C+V+C 概念 · 第 12 课 ⭐ “I Can Read!” 挑战</text>

  <!-- Phase 4 -->
  <circle cx="110" cy="1155" r="34" fill="#9B59B6"/>
  <text x="110" y="1167" font-size="30" text-anchor="middle">📖</text>
  <g filter="url(#shadow)"><rect x="170" y="1100" width="850" height="115" rx="18" fill="#FFFFFF"/></g>
  <rect x="170" y="1100" width="12" height="115" rx="6" fill="#9B59B6"/>
  <text x="205" y="1140" font-size="28" font-weight="700" fill="#333">Phase 4 · Stories + Food</text>
  <text x="990" y="1140" font-size="22" fill="#9B59B6" font-weight="700" text-anchor="end">第 13–16 课</text>
  <text x="205" y="1175" font-size="21" fill="#555">故事角色 · 情绪 happy / sad · 食物 · I want... / I like... / I don't like...</text>
  <text x="205" y="1203" font-size="21" fill="#E8551E">Phonics：c /k/ /s/ · k · x · r h g j · 开始读简单句子</text>

  <!-- Phase 5 -->
  <circle cx="110" cy="1300" r="34" fill="#1ABC9C"/>
  <text x="110" y="1312" font-size="30" text-anchor="middle">👕</text>
  <g filter="url(#shadow)"><rect x="170" y="1245" width="850" height="115" rx="18" fill="#FFFFFF"/></g>
  <rect x="170" y="1245" width="12" height="115" rx="6" fill="#1ABC9C"/>
  <text x="205" y="1285" font-size="28" font-weight="700" fill="#333">Phase 5 · Clothes + Animals</text>
  <text x="990" y="1285" font-size="22" fill="#1ABC9C" font-weight="700" text-anchor="end">第 17–20 课</text>
  <text x="205" y="1320" font-size="21" fill="#555">服装 · 动物 · 动作词 · I'm wearing... / It's drinking.</text>
  <text x="205" y="1348" font-size="21" fill="#E8551E">Phonics：th ch sh 辅音组合 · w wh ng mb · 初识 lamb / comb 等特殊拼写</text>

  <!-- Phase 6 -->
  <circle cx="110" cy="1445" r="34" fill="#E8551E"/>
  <text x="110" y="1457" font-size="30" text-anchor="middle">⭐</text>
  <g filter="url(#shadow)"><rect x="170" y="1390" width="850" height="170" rx="18" fill="#FFF4EC"/></g>
  <rect x="170" y="1390" width="12" height="170" rx="6" fill="#E8551E"/>
  <text x="205" y="1430" font-size="28" font-weight="700" fill="#333">Phase 6 · 综合能力提升</text>
  <text x="990" y="1430" font-size="22" fill="#E8551E" font-weight="700" text-anchor="end">第 21–24 课</text>
  <text x="205" y="1465" font-size="21" fill="#555">第 21 课 Units 5–8 总复习 · 第 22 课 Phonics Reading Day：独立读 “A cat is on a mat.”</text>
  <text x="205" y="1495" font-size="21" fill="#555">第 23 课 My World Book 项目：画画 + 单词 + 句子，完成 4–6 页自己的小书</text>
  <text x="205" y="1530" font-size="22" font-weight="700" fill="#E8551E">第 24 课 🌟 English Mission Day：五大闯关站 + 颁发结业证书</text>

  <!-- Outcomes -->
  <text x="60" y="1640" font-size="36" font-weight="800" fill="#333">24 课后，孩子能做到</text>
  <line x1="440" y1="1632" x2="1020" y2="1632" stroke="#F3D9B8" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="60" y="1670" width="225" height="130" rx="18" fill="#FFFFFF"/>
    <rect x="305" y="1670" width="225" height="130" rx="18" fill="#FFFFFF"/>
    <rect x="550" y="1670" width="225" height="130" rx="18" fill="#FFFFFF"/>
    <rect x="795" y="1670" width="225" height="130" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="172" y="1718" font-size="34" text-anchor="middle">🗣</text>
  <text x="172" y="1752" font-size="22" font-weight="700" fill="#333" text-anchor="middle">8 大主题 80+ 词汇</text>
  <text x="172" y="1780" font-size="19" fill="#777" text-anchor="middle">看图能说简单句</text>
  <text x="417" y="1718" font-size="34" text-anchor="middle">🔤</text>
  <text x="417" y="1752" font-size="22" font-weight="700" fill="#333" text-anchor="middle">掌握字母音与短元音</text>
  <text x="417" y="1780" font-size="19" fill="#777" text-anchor="middle">听音辨音 · 拼合 · 拆分</text>
  <text x="662" y="1718" font-size="34" text-anchor="middle">📖</text>
  <text x="662" y="1752" font-size="22" font-weight="700" fill="#333" text-anchor="middle">独立拼读生词</text>
  <text x="662" y="1780" font-size="19" fill="#777" text-anchor="middle">读懂 decodable 短句</text>
  <text x="907" y="1718" font-size="34" text-anchor="middle">🏅</text>
  <text x="907" y="1752" font-size="22" font-weight="700" fill="#333" text-anchor="middle">完成 My World Book</text>
  <text x="907" y="1780" font-size="19" fill="#777" text-anchor="middle">获得首张英语证书</text>

  <!-- Footer -->
  <rect x="0" y="1840" width="1080" height="80" fill="#333"/>
  <text x="60" y="1889" font-size="24" fill="#FFFFFF">📞 咨询报名：__________________</text>
  <text x="1020" y="1889" font-size="22" fill="#CCCCCC" text-anchor="end">每周 1 次 · 每次 1 课 · 小班教学</text>
</svg>
